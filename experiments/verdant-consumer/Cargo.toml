[package]
name = "pixel-pals-verdant-consumer"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
# Verdant v2.21.7 is a version-specific sparse registry release, not a mutable git branch.
verdant-core = { version = "=2.21.7", registry = "verdant", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
