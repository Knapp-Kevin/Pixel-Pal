name: Verify private deployment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public HTTPS URL of the private Pixel Pals deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify actual HTTPS responses
        env:
          PIXEL_PALS_DEPLOYMENT_URL: ${{ inputs.base_url }}
        run: npm run verify:deployment -- "$PIXEL_PALS_DEPLOYMENT_URL"
