name: Canonical Pal Candidate Review

on:
  pull_request:
    paths:
      - art/pal-candidate-manifest.json
      - art/candidates/pals/**
      - art/review/candidates/pals/**
      - scripts/import-pal-candidate.mjs
      - scripts/verify-pal-candidate-import.mjs
      - scripts/verify-pal-candidate-manifest.mjs
      - scripts/generate-pal-candidate-review.mjs
      - scripts/verify-pal-candidate-review.mjs
      - scripts/cdp-browser.mjs
      - package.json
      - .github/workflows/pal-candidate-review.yml

permissions:
  contents: read

concurrency:
  group: pal-candidate-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify Pal identity and intake contract
        run: |
          node --check scripts/import-pal-candidate.mjs
          node --check scripts/verify-pal-candidate-import.mjs
          node --check scripts/verify-pal-candidate-manifest.mjs
          node --check scripts/generate-pal-candidate-review.mjs
          node --check scripts/verify-pal-candidate-review.mjs
          npm run verify:pal-candidate-import
          npm run verify:pal-candidates

      - name: Generate isolated Pal review surface
        run: npm run generate:pal-candidate-review

      - name: Verify compact tablet review
        run: |
          python3 -m http.server 4177 --directory artifacts/pal-candidate-review > /tmp/pixel-pals-pal-review.log 2>&1 &
          REVIEW_PID=$!
          trap 'kill $REVIEW_PID' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4177/index.html > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat /tmp/pixel-pals-pal-review.log
              exit 1
            fi
            sleep 0.25
          done
          PAL_REVIEW_BASE_URL=http://127.0.0.1:4177 npm run verify:pal-candidate-review

      - name: Upload Pal review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: canonical-pal-candidate-review
          path: artifacts/pal-candidate-review
          if-no-files-found: error
          retention-days: 14
