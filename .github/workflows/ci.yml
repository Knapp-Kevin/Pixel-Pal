name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify release script syntax
        run: |
          node --check scripts/verify-build-artifacts.mjs
          node --check scripts/verify-deployment.mjs
          node --check scripts/cdp-browser.mjs
          node --check scripts/viewport-actions.mjs
          node --check scripts/viewport-accessibility-actions.mjs
          node --check scripts/viewport-home-actions.mjs
          node --check scripts/viewport-lifecycle-actions.mjs
          node --check scripts/verify-tablet-viewports.mjs
          node --check scripts/verify-tablet-suspension.mjs
          node --check scripts/verify-illustrated-adventures.mjs
          node --check scripts/verify-multiple-worlds.mjs
          node --check scripts/verify-emulated-tablet-performance.mjs
          node --check scripts/verify-traits-lab.mjs
          node --check scripts/verify-production-art.mjs
          node --check scripts/verify-human-art-reviews.mjs
          node --check scripts/generate-production-art-registry.mjs
          node --check scripts/generate-art-review-report.mjs

      - name: Verify production art planning contract
        run: npm run verify:art-plan

      - name: Verify human art review decisions
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run verify:art-reviews 2>&1 | tee artifacts/art-review-decision-verification.log

      - name: Verify generated production art registry
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run verify:art-registry 2>&1 | tee artifacts/art-registry-verification.log

      - name: Generate production art review evidence
        run: npm run generate:art-review

      - name: Typecheck
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run typecheck 2>&1 | tee artifacts/typecheck-results.log

      - name: Test
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/test-results.log

      - name: Build production-only application
        run: npm run build

      - name: Verify production-only tablet routes
        run: |
          set -o pipefail
          npm run preview --workspace=@pixel-pals/tablet -- --host 127.0.0.1 --port 4173 > /tmp/pixel-pals-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat /tmp/pixel-pals-preview.log
              exit 1
            fi
            sleep 0.25
          done
          mkdir -p artifacts
          npm run verify:performance 2>&1 | tee artifacts/performance-verification.log
          npm run verify:viewports 2>&1 | tee artifacts/viewport-verification.log
          npm run verify:traits-lab 2>&1 | tee artifacts/traits-lab-verification.log
          npm run verify:suspension 2>&1 | tee artifacts/suspension-verification.log
          EXPECT_RAIN_PATH_FALLBACK=true npm run verify:adventures 2>&1 | tee artifacts/adventure-verification.log
          npm run verify:worlds 2>&1 | tee artifacts/world-catalog-verification.log

      - name: Build benchmark art review application
        env:
          VITE_PIXEL_PALS_ART_STATUS: benchmark
        run: npm run build --workspace=@pixel-pals/tablet -- --outDir dist-benchmark

      - name: Verify benchmark art across five starter species
        run: |
          set -o pipefail
          python3 -m http.server 4174 --directory apps/tablet/dist-benchmark > /tmp/pixel-pals-benchmark-preview.log 2>&1 &
          BENCHMARK_PID=$!
          trap 'kill $BENCHMARK_PID' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat /tmp/pixel-pals-benchmark-preview.log
              exit 1
            fi
            sleep 0.25
          done
          VIEWPORT_BASE_URL=http://127.0.0.1:4174 \
          EXPECT_RAIN_PATH_ART_STATUS=benchmark \
          ADVENTURE_SCREENSHOT_SUBDIR=benchmark-art-review \
          npm run verify:adventures 2>&1 | tee artifacts/benchmark-art-verification.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tablet-viewport-screenshots
          path: |
            artifacts/art-review
            artifacts/art-review-decisions
            artifacts/art-review-decision-verification.log
            artifacts/benchmark-art-review
            artifacts/benchmark-art-verification.log
            artifacts/performance
            artifacts/performance-verification.log
            artifacts/art-registry-verification.log
            artifacts/typecheck-results.log
            artifacts/test-results.log
            artifacts/tablet-viewports
            artifacts/viewport-verification.log
            artifacts/traits-lab
            artifacts/traits-lab-verification.log
            artifacts/suspension-verification.log
            artifacts/adventure-verification.log
            artifacts/world-catalog-verification.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify installable production build artifacts
        run: npm run verify:artifacts
