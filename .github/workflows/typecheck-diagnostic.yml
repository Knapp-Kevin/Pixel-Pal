name: Day Cycle Typecheck Diagnostic

on:
  push:
    branches: [chore/verify-day-cycle-foundation]

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Capture typecheck output
        run: npm run typecheck > docs/reviews/TEMP_DAY_CYCLE_TYPECHECK.log 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/reviews/TEMP_DAY_CYCLE_TYPECHECK.log
          git commit -m "chore: record day cycle typecheck diagnostics" || exit 0
          git push
