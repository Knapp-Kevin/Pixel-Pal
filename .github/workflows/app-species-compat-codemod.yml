name: Apply App species compatibility codemod

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-species-compat-codemod.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main

      - name: Remove silent Fox fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/tablet/src/App.tsx')
          text = path.read_text()
          text = text.replace(
              "import { MemoryJournal } from './MemoryJournal';\n",
              "import { MemoryJournal } from './MemoryJournal';\nimport { requireRenderableSpecies } from './tabletProfile';\n"
          )
          text = text.replace(
              "function renderableSpecies(speciesId: string): PalSpecies {\n"
              "  if (speciesId === 'deer' || speciesId === 'rabbit' || speciesId === 'cat' || speciesId === 'duck') {\n"
              "    return speciesId;\n"
              "  }\n"
              "  return 'fox';\n"
              "}\n\n",
              ""
          )
          text = text.replace("renderableSpecies(", "requireRenderableSpecies(")
          text = text.replace(
              "import { HomeScene, PalPortrait, WillowmereScene, type PalSpecies } from '@pixel-pals/renderer';",
              "import { HomeScene, PalPortrait, WillowmereScene } from '@pixel-pals/renderer';"
          )
          path.write_text(text)

      - name: Commit the codemod
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- apps/tablet/src/App.tsx)" ]; then
            echo "App compatibility codemod already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tablet/src/App.tsx
          git commit -m "fix: remove silent Fox fallback from tablet app"
          git push origin HEAD:main
