name: Build Pixel Pal public brand PNGs (temporary bootstrap)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - assets/brand/**
      - scripts/render-brand-assets.mjs
      - scripts/verify-brand-assets.mjs
      - .github/workflows/brand-bootstrap.yml
permissions:
  contents: write
jobs:
  render-and-commit:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/public-facing-readme-and-brand' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout same-repository PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/public-facing-readme-and-brand
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Render repository banner and social preview
        run: node scripts/render-brand-assets.mjs
      - name: Verify exact PNG dimensions
        run: node scripts/verify-brand-assets.mjs
      - name: Commit generated PNG files only
        run: |
          git add assets/brand/readme-banner.png assets/brand/social-preview.png
          if git diff --cached --quiet; then
            echo "Brand PNG files are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: render public Pixel Pal banner and social preview"
            git push origin HEAD:refs/heads/docs/public-facing-readme-and-brand
          fi
