name: Viewport Debug

on:
  push:
    branches: [chore/verify-tablet-viewports-2]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: chore/verify-tablet-viewports-2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Capture viewport verifier output
        run: |
          npm ci --no-audit --no-fund > /dev/null
          npm run build > /dev/null
          npm run preview --workspace=@pixel-pals/tablet -- --host 127.0.0.1 --port 4173 > /tmp/pixel-pals-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID' EXIT
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 0.25
          done
          set +e
          npm run verify:viewports > viewport-failure.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add viewport-failure.log
            git commit -m "chore: capture corrected viewport failure"
            git push origin HEAD:chore/verify-tablet-viewports-2
            exit "$STATUS"
          fi
          rm -f viewport-failure.log
