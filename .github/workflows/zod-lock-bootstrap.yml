name: Bootstrap patched Zod lockfile (temporary)
on:
  push:
    branches: [fix/zod4-public-security]
    paths:
      - packages/content-schema/package.json
      - .github/workflows/zod-lock-bootstrap.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: ${{ github.repository == 'Knapp-Kevin/Pixel-Pal' && github.ref == 'refs/heads/fix/zod4-public-security' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/zod4-public-security
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve matching npm lockfile, no package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit matching lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(deps): lock patched Zod 4 transitive resolution"
            git push origin HEAD:refs/heads/fix/zod4-public-security
          fi
